# deal-engine example configuration. Copy to config.yaml and adjust.
# The demo (make demo) runs with this file as it is.

data_dir: data                 # state, tracking database, work files, reports, rendered pages

# Your home location: used for pickup distances (listings with lat/lon) and for shipping
# estimates (eBay uses postal code + country). The values below are an EXAMPLE
# (Berlin city centre) - replace them with your own.
location:
  lat: 52.5200
  lon: 13.4050
  postal_code: "10115"
  country: DE
  road_factor: 1.3             # straight-line km x factor = rough road km

# How buying works for you: pickup vs. shipping and the fees involved.
shipping:
  pickup_km: 60                # pick up yourself up to this distance, beyond that ship if possible
  drive_kmh: 70                # average speed for pickup trips (driving time counts as work time)
  km_cost: 0.25                # cost per km (there and back)
  ship_in_cost: 6              # parcel to you if nothing else is known
  buyer_protection_fee_pct: 0.04   # platform shipping with buyer protection: fee in % ...
  buyer_protection_fee_min: 0.99   # ... but at least this
  unknown_cost: 15             # source states no shipping cost (e.g. eBay without shippingCost): assume this, never 0

# LLM steps (evaluation, optional prefilter and classification) use the Claude Code CLI.
llm:
  command: ["claude", "-p"]
  extra_args: ["--strict-mcp-config", "--mcp-config", '{"mcpServers": {}}']   # no MCP servers
  eval_model: sonnet
  prefilter_model: haiku
  classify_model: haiku
  timeout_minutes: 60

web:
  root: "{data_dir}/web"
  copy_prompt: false           # "copy as prompt" button on every card (listing summary for a chat); per search: searches.<name>.web.copy_prompt
  compare_links:               # "compare yourself" links on every card, {query} = group or title
    - label: eBay sold
      url: "https://www.ebay.com/sch/i.html?_nkw={query}&LH_Sold=1&LH_Complete=1"

deals:
  port: 8081
  market_search: electronics   # price hints in the deal list come from this search

searches:
  electronics:
    title: Electronics
    profile: profiles/electronics.md   # search criteria and evaluation rules for the LLM
    adapters: [json_file]              # add "ebay" once EBAY_CLIENT_ID/SECRET are set
    json_file:
      path: "{data_dir}/listings.json"
    ebay:
      markets: [EBAY_DE]
      conditions: [3000, 7000]         # used, for parts / not working
      limit: 50
      include_auctions: false
      keywords: ["ps5 defective", "switch oled", "dualsense", "steam deck", "thinkpad t480"]
    keywords: []                       # empty = one query for everything the adapter delivers

    max_new_per_run: 50
    batch_size: 25
    images: 1                          # photos downloaded per candidate for the evaluator

    filters:
      min_price: 5
      max_price: 800
      max_age_days: 30
      max_pickup_km: 80                # pickup-only listings further away are skipped
      # accessories of a market group are skipped automatically (accessory words of the locale, deal_engine/core/locale.py; override with market.accessory_regex)
      exclude_title_regex: "\\b(wanted|buying|swap|trade)\\b|repair service"
      # defect signal: listings with it are repair candidates, without it flips
      signal_regex: "defect|broken|for parts|faulty|drift|no picture|no hdmi|does not charge|won't turn on|overheat|loud fan|cracked|liquid damage|without (ram|ssd)|battery (service|worn)|not working|shuts down|blue light|flicker|missing"
      body_signal_regex: "sold as defective|for parts|(?<!not )broken|not working"

    market:
      refresh_hours: 20
      sale_factor: 0.85                # asking median -> realistic resale price
      flip_ratio: 0.7                  # working units: candidate below median x 0.7
      defect_price_ratio: 0.6          # defective units: candidate below median x 0.6
      # first group whose match hits and whose exclude does not; an excluded title falls through to the
      # next groups. veto (optional): if match and veto both hit, the title gets no group at all
      # (no fall-through), e.g. "PS5 headset" must not be compared with the PS5 price, while
      # "PS5 with headset" stays a PS5 (the lookahead skips titles with with/incl/and/without/+/&)
      groups:
        - {name: PS5, keyword: ps5, match: "\\bps5\\b|playstation 5", exclude: "controller|dualsense|pro\\b", veto: "^(?!.*(\\b(with|incl|and|without)\\b|[+&])).*(headset|camera|\\bvr2?\\b)", min: 250, max: 600, flip: true}
        - {name: PS4, keyword: ps4, match: "\\bps4\\b|playstation 4", exclude: "controller|pro\\b", min: 60, max: 250, flip: true}
        - {name: Switch OLED, keyword: switch oled, match: "switch.*oled", min: 150, max: 380, flip: true}
        - {name: Switch Lite, keyword: switch lite, match: "switch\\s*lite", min: 60, max: 200, flip: true}
        - {name: DualSense, keyword: dualsense, match: "dualsense|ps5 controller", exclude: "edge", min: 20, max: 90, flip: true}
        - {name: Xbox Series S, keyword: series s, match: "series\\s*s\\b", min: 100, max: 320, flip: true}
        - {name: Steam Deck, keyword: steam deck, match: "steam\\s*deck", exclude: "dock", min: 180, max: 550, flip: true}
        - {name: ThinkPad T480, keyword: t480, match: "thinkpad.*t480|\\bt480\\b", min: 100, max: 400, flip: true}
        - {name: MacBook Air M1, keyword: macbook air m1, match: "macbook air.*m1", min: 300, max: 900, flip: true}

    track: true                        # price tracking in history.db (sale price estimates)
    track_checks: {per_group: 8, max_checks: 60}
    insights: {min_sold: 8, window_days: 60, sold_factor: 0.93}

    score:
      enabled: true                    # computed score; see deal_engine/core/score.py for all parameters
      min_profit: {flip: 15, repair: 10}
      target_score: 6

    parts_catalog: false               # add the parts catalogue/stock of the deal list to the evaluation prompt
    prefilter: false                   # cheap model drops obvious junk before the evaluation
    classify: false                    # LLM assigns titles to groups, also before the candidate selection (needs the Claude Code CLI; {enabled: true, model: haiku, max_per_run: 600})

    # The static page of this search (python -m deal_engine render). Without "web" a search gets a
    # generic page (score, price, location). Every label can be plain text or one text per locale
    # ({en: Profit, de: Gewinn}); a missing label is the field label of the locale.
    web:
      slug: electronics                # page lives at <web.root>/<slug>/ (default: search name)
      tiers: {A: {en: "Worth it (score 7+)", de: "Lohnt sich (Score 7+)"}, B: {en: "Borderline (5–6)", de: "Grenzfall (5–6)"},
              C: {en: "Rather not (up to 4)", de: "Eher nicht (bis 4)"}}
      columns:                         # extra columns of the top-5 table; format: eur, int or text
        - {label: {en: Profit, de: Gewinn}, field: expected_profit_eur, format: eur}
        - {label: "€/h", field: profit_per_hour_eur, format: int}
      meta: [device, defect, location] # fields in the line below the card title
      # built-in badges: deal_type, risk, photo_check, shipping_unknown, auction_end, parts_in_stock;
      # generic ones: {field: ..., label: "text {value}", class: ok|bad|unk|new, when: value or [values]}
      badges: [deal_type, risk, photo_check, shipping_unknown, auction_end, parts_in_stock]
      sorts:                           # first one is the default
        - {label: Score, field: score, desc: true}
        - {label: "€/h", field: profit_per_hour_eur, desc: true}
        - {label: {en: Profit, de: Gewinn}, field: expected_profit_eur, desc: true}
        - {label: {en: Price, de: Preis}, field: price}
        - {label: {en: Distance, de: Entfernung}, field: distance_km}
      facets:                          # for grouping and filter chips; "tier" is always there
        - key: cat                     # regex categories: first matching rule wins, in this order
          label: {en: Category, de: Kategorie}
          from: [title, device, market_group]
          rules:
            - [{en: Controllers, de: Controller}, 'controller|dualsense|dualshock|joy[- ]?con|gamepad|\belite\b']
            - [Handhelds, 'steam\s*deck|rog\s*ally|switch\s*lite|\b[23]ds\b|\bvita\b|game\s*boy']
            - [{en: Consoles, de: Konsolen}, '\bps[1-5]\b|playstation|xbox|switch|\bwii\b|console']
            - [Laptops & PCs, 'laptop|notebook|thinkpad|latitude|elitebook|macbook|mini[- ]?pc|optiplex|graphics card|\brtx\b']
            - [{en: Phones & tablets, de: Handys & Tablets}, 'iphone|ipad|galaxy|pixel|smartphone|tablet']
            - [{en: Audio & wearables, de: Audio & Wearables}, 'headphones?|airpods|earbuds|watch']
          other: {en: Other, de: Sonstiges}
        - {key: kind, label: {en: Kind, de: Art}, field: deal_type, default: repair, capitalize: true}
      groups: [cat, tier, kind]        # "group by" choices, first one is the default
      chips: [cat, kind]               # filter chips
      # orders: {kind: [Repair, Flip]} # fixed value order of a facet (regex facets use their rule order)
      toggles:                         # filter buttons: equals, max or min
        - {key: ship, label: {en: shipping possible, de: Versand möglich}, field: shipping_possible, equals: true}
        - {key: near, label: "≤ 50 km", field: distance_km, max: 50}
      deal_link: true                  # "bought → deal list" link on every card

  # A second search would get its own page. Sketch for motorbikes whose evaluation profile
  # returns touring_score and gravel_score (0-10):
  # motorbikes:
  #   title: Motorbikes
  #   profile: profiles/motorbikes.md
  #   ...
  #   web:
  #     columns:
  #       - {label: Touring, field: touring_score, format: int}
  #       - {label: Gravel, field: gravel_score, format: int}
  #       - {field: km, format: int}
  #     meta: [year, km, location]
  #     sorts:
  #       - {label: Score, field: score, desc: true}
  #       - {label: Touring, field: touring_score, desc: true}
  #       - {label: Gravel, field: gravel_score, desc: true}
  #       - {label: Price, field: price}
  #     toggles:
  #       - {key: a2, label: A2 license, field: ps, max: 48}
