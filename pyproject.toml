[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-engine"
version = "0.2.9"
description = "Self-hosted engine for finding second-hand deals: listing state, market prices, tracking, LLM evaluation and scoring"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["deal_engine", "deal_engine.core", "deal_engine.adapters", "deal_engine.deals", "deal_engine.web", "deal_engine.demo"]

[tool.setuptools.package-data]
"deal_engine.core" = ["prompts/*/*.md"]
"deal_engine.deals" = ["deals.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
